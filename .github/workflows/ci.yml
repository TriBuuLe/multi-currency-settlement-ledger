name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The tests run against a real Postgres through Testcontainers. Docker is
      # already present on ubuntu-latest, and substituting an in-memory database
      # would skip exactly the features this schema relies on: deferrable constraint
      # triggers, SET CONSTRAINTS ALL IMMEDIATE, composite foreign keys, jsonb.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # Starts the real image against a real database and walks the full flow, so a
      # break in wiring, migrations, or the HTTP layer fails CI rather than being
      # discovered by hand.
      - name: Start the stack
        run: docker compose up -d --build postgres ledger

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "the service never became healthy"; docker compose logs ledger; exit 1

      - name: Walk the demo flow
        run: ./scripts/demo.sh

      - name: Verify the books
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/admin/verify > verify.json
          cat verify.json
          python3 -c "import json;r=json.load(open('verify.json'));assert r['healthy'], r['findings']"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
