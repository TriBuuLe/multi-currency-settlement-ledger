# Scrapes the ledger's metrics. The one series worth alerting on is
# ledger_trial_balance_residual_minor_units: it must be zero for every currency.
# If it is not, the books do not add up and no other signal matters.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: settlement-ledger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ledger:8080"]
